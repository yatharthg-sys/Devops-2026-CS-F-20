name: Continuous Integration & Automated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Backend Test Suite & Health Validation
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: Backend
        run: npm ci

      - name: Run Automated API Tests
        working-directory: Backend
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/shekhawat_dhaba_test
        run: npm test

  docker-build:
    name: Docker Image Build & Container Smoke Test
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: shekhawat-dhaba:latest

      - name: Smoke Test Container Runtime
        run: |
          docker run -d --name smoke-test -p 5000:5000 shekhawat-dhaba:latest
          sleep 6
          docker logs smoke-test
          curl -f http://localhost:5000/api/health
          docker stop smoke-test
          docker rm smoke-test
