apiVersion: apps/v1
kind: Deployment
metadata:
  name: dhaba-app-deployment
  namespace: shekhawat-dhaba
  labels:
    app: shekhawat-dhaba-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shekhawat-dhaba-app
  template:
    metadata:
      labels:
        app: shekhawat-dhaba-app
    spec:
      containers:
        - name: dhaba-app
          image: shekhawat-dhaba:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: dhaba-config
            - secretRef:
                name: dhaba-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
