<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href='https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">

    <title>Shekhawat Dhaba | Authentic Rajasthani Food</title>
</head>
<body>
    <!--========== LOADER ==========-->
<div class="loader" id="loader">
  <div class="loader__content">
    <img src="assets/img/logo.png" alt="Shekhawat Dhaba" class="loader__logo">
    <span class="loader__text">Shekhawat Dhaba</span>
  </div>
</div>

    <a href="#" class="scrolltop" id="scroll-top">
        <i class='bx bx-chevron-up scrolltop__icon'></i>
    </a>

    <!--========== TOAST ==========-->
    <div class="toast" id="toast"></div>

    <!--========== HEADER ==========-->
    <header class="l-header" id="header">
        <nav class="nav bd-container">
            <a href="#" class="nav__logo">
                <img src="assets/img/logo.png" alt="Logo">
                <span>Shekhawat Dhaba</span>
            </a>

            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li class="nav__item"><a href="#home" class="nav__link active-link">Home</a></li>
                    <li class="nav__item"><a href="#about" class="nav__link">About</a></li>
                    <li class="nav__item"><a href="#services" class="nav__link">Services</a></li>
                    <li class="nav__item"><a href="#menu" class="nav__link">Menu</a></li>
                    <li class="nav__item"><a href="#contact" class="nav__link">Contact us</a></li>
                    <li><i class='bx bx-moon change-theme' id="theme-button"></i></li>
                </ul>
            </div>

            <div class="nav__toggle" id="nav-toggle">
                <i class='bx bx-menu'></i>
            </div>
        </nav>
    </header>

    <main class="l-main">
        <!--========== HOME ==========-->
        <section class="home" id="home">
            <div class="home__container bd-container bd-grid">
                <div class="home__data">
                    <span class="home__subtitle">Welcome to Jaipur's Dhaba</span>
                    <h1 class="home__title">Authentic Rajasthani food & taste</h1>
                    <h2 class="home__subtitle-2">Traditional spices, tandoori breads, and royal gravies cooked fresh every day.</h2>
                    <div class="home__buttons">
                        <a href="#menu" class="button">View Menu</a>
                        <a href="#contact" class="button button-ghost">Reserve Table</a>
                    </div>
                </div>
                <img src="assets/img/home.png" alt="Authentic Rajasthani Food" class="home__img">
            </div>
        </section>

       <div class="jaali-divider"></div>
        <!--========== MENU (rendered dynamically from backend) ==========-->
        <section class="menu section bd-container" id="menu">
            <span class="section-subtitle">Special</span>
            <h2 class="section-title">Menu of the week</h2>

            <div class="menu__container bd-grid" id="menu-container">
                <p class="menu__loading">Loading menu…</p>
            </div>
        </section>
    </main>
</body>
</html>
